[project]
name = "pokemon-copilot"
version = "0.1.0"
description = "Pokemon battle copilot Phase 1 UI skeleton"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "rapidfuzz>=3.9.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
