[project]
name = "pokemon-copilot"
version = "1.2.0"
description = "Practical 1.2 trusted-state capture and readiness advisor"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "PySide6>=6.7",
    "rapidfuzz>=3.9.0",
    "requests>=2.31",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pydantic>=2.13.3",
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.8.0",
]

[project.optional-dependencies]
learning = [
    "torch==2.8.0",
    "sb3-contrib==2.7.1",
    "stable-baselines3==2.7.1",
    "gymnasium==1.2.3",
    "poke-env==0.10.0",
    "numpy==2.4.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "learning" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: performance/benchmark tests, excluded from default run (use `pytest -m slow`)",
]
addopts = "-m 'not slow'"
